<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ক্বিরাতুল কোরআন ইসলামিয়া মাদরাসা - ফলাফল ব্যবস্থাপনা</title>
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SolaimanLipi', 'Bangla', Arial, sans-serif; }
        body { background: #f0f2f5; }
        
        /* পাবলিক পেজ */
        .public-page { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 25px; text-align: center; }
        .login-buttons { position: fixed; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 10px; }
        .login-buttons button { padding: 8px 20px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .login-buttons button:first-child { background: #2ecc71; color: white; }
        .login-buttons button:last-child { background: #3498db; color: white; }
        .filter-bar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 20px; padding: 20px; background: #f8f9fa; border-radius: 15px; }
        .filter-bar select, .filter-bar input, .filter-bar button { padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; }
        .filter-bar button { background: #2a5298; color: white; border: none; cursor: pointer; }
        .results-table { overflow-x: auto; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px 8px; text-align: center; vertical-align: middle; }
        th { background: #2c3e50; color: white; }
        .hold-badge { background: #f39c12; color: white; padding: 3px 10px; border-radius: 20px; font-size: 11px; display: inline-block; }
        .hold-row { background: #fff3cd; }
        .contact-info { background: #e8f4fc; padding: 20px; margin: 20px; border-radius: 10px; text-align: center; line-height: 1.8; }
        .footer { text-align: center; padding: 20px; background: #1e3c72; color: white; }
        
        /* অ্যাডমিন ও শিক্ষক প্যানেল */
        .admin-panel, .teacher-panel { max-width: 1400px; margin: 0 auto; background: white; }
        .panel-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .tabs { display: flex; gap: 5px; margin: 0 20px; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 12px 25px; background: #e0e0e0; border: none; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #2a5298; color: white; }
        .tab-content { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-card { background: #f0f8ff; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .form-row > div { flex: 1; min-width: 150px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { transform: translateY(-2px); }
        button.danger { background: #e74c3c; }
        button.warning { background: #f39c12; }
        button.info { background: #3498db; }
        
        .subject-group { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .subject-group h4 { background: #ecf0f1; display: inline-block; padding: 5px 15px; border-radius: 20px; margin-bottom: 10px; }
        .marks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
        .marks-item { background: #f9f9f9; padding: 8px; border-radius: 8px; }
        .marks-item input { width: 80px; margin-left: 10px; }
        
        .teacher-item, .exam-item { background: #f8f9fa; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; max-width: 450px; width: 90%; }
        
        @media (max-width: 768px) { .form-row { flex-direction: column; } }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>

<!-- ======================= পাবলিক হোমপেজ ======================= -->
<div id="publicPage" class="public-page">
    <div class="login-buttons no-print">
        <button onclick="showAdminLogin()">👨‍💼 অ্যাডমিন লগইন</button>
        <button onclick="showTeacherLogin()">👨‍🏫 শিক্ষক লগইন</button>
    </div>
    <div class="header">
        <h1>📚 ক্বিরাতুল কোরআন ইসলামিয়া মাদ্রাসা</h1>
        <h2>🎓 শিক্ষার্থীদের ফলাফল দেখুন</h2>
    </div>
    <div class="filter-bar no-print">
        <select id="publicClass">
            <option>শিশু</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option>
        </select>
        <select id="publicExam"></select>
        <input type="number" id="publicRoll" placeholder="রোল নং (ঐচ্ছিক)">
        <button onclick="loadPublicResult()">🔍 দেখুন</button>
        <button onclick="window.print()">🖨️ প্রিন্ট</button>
    </div>
    <div id="publicResultArea"></div>
    <div class="contact-info">
        <strong>📞 যোগাযোগ:</strong><br>
        📧 ইমেইল: abdurtuhin420@gmail.com<br>
        📱 মুহতামিম: 01812-890742<br>
        💻 টেকনিক্যাল সাপোর্ট (Tuhin-IT): 01790066630
    </div>
    <div class="footer">Developed by Tuhin-IT | বাংলাদেশ শিক্ষাবোর্ড গ্রেডিং সিস্টেম</div>
</div>

<!-- ======================= লগইন মডাল ======================= -->
<div id="adminLoginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 অ্যাডমিন লগইন</h3>
        <input type="text" id="adminUser" placeholder="ইউজারনেম">
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড">
        <button onclick="adminLogin()">লগইন</button>
        <button onclick="closeModals()">বাতিল</button>
    </div>
</div>
<div id="teacherLoginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 শিক্ষক লগইন</h3>
        <input type="text" id="teacherUser" placeholder="ইউজারনেম">
        <input type="password" id="teacherPass" placeholder="পাসওয়ার্ড">
        <button onclick="teacherLogin()">লগইন</button>
        <button onclick="closeModals()">বাতিল</button>
    </div>
</div>

<script>
    (function() {
        // ======================= কনফিগারেশন =======================
        const subjects = {
            'শিশু': ['ইংরেজি', 'হাদিস', 'গণিত', 'কালেমা ও মাসায়েল', 'আরবি', 'বাংলা'],
            '১ম': ['ইংরেজি', 'হাদিস', 'গণিত', 'মাছআলা', 'কোরআন শিখা', 'বাংলা'],
            '২য়': ['ইংরেজি', 'হাদিস', 'গণিত', 'দোয়া', 'কোরআন', 'বাংলা'],
            '৩য়': ['ইংরেজি', 'হাদিস', 'গণিত', 'উর্দু', 'কোরআন', 'বাংলা'],
            '৪র্থ': ['ইংরেজি', 'ইসলামি তাহযিব', 'গণিত', 'এসো আরবি শিখি', 'কোরআন', 'বাংলা', 'ভূগোল ও ইতিহাস'],
            '৫ম': ['ইংরেজি', 'ইসলামি তাহযিব', 'গণিত', 'এসো আরবি শিখি', 'কোরআন', 'বাংলা', 'ভূগোল ও ইতিহাস']
        };
        
        // ======================= গ্লোবাল ডাটা =======================
        let allStudents = JSON.parse(localStorage.getItem('allStudents') || '{"শিশু":[],"১ম":[],"২য়":[],"৩য়":[],"৪র্থ":[],"৫ম":[]}');
        let exams = JSON.parse(localStorage.getItem('exams') || '[]');
        let marks = JSON.parse(localStorage.getItem('marks') || '{}');
        let teachers = JSON.parse(localStorage.getItem('teachers') || '[]');
        let holdList = JSON.parse(localStorage.getItem('holdList') || '{}');
        let currentUser = null;
        
        // ডিফল্ট শিক্ষক (করিম স্যার)
        if(teachers.length === 0) {
            teachers = [{ id: 1, name: 'করিম স্যার', username: 'karim', password: '123', assigned: [{ class: '৫ম', subs: ['গণিত', 'ইংরেজি'] }] }];
            localStorage.setItem('teachers', JSON.stringify(teachers));
        }
        // ডিফল্ট পরীক্ষা
        if(exams.length === 0) {
            exams = [{ id: 1, name: 'বার্ষিক পরীক্ষা ২০২৬', open: true }];
            localStorage.setItem('exams', JSON.stringify(exams));
        }
        
        // ======================= হেল্পার ফাংশন =======================
        function bn(n) { return n?.toString().replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) || ''; }
        
        function getGrade(m) {
            if(m>=80) return 'A+';
            if(m>=70) return 'A';
            if(m>=60) return 'A-';
            if(m>=50) return 'B';
            if(m>=40) return 'C';
            if(m>=33) return 'D';
            return 'F';
        }
        function getGP(g) {
            if(g=='A+') return 5;
            if(g=='A') return 4;
            if(g=='A-') return 3.5;
            if(g=='B') return 3;
            if(g=='C') return 2;
            if(g=='D') return 1;
            return 0;
        }
        
        function calculateResult(cls, examId) {
            let subList = subjects[cls] || [];
            let studentsList = allStudents[cls] || [];
            let results = [];
            studentsList.forEach(s => {
                let total = 0, totalGP = 0, fail = false;
                let marksArr = [];
                subList.forEach(sub => {
                    let m = parseInt(marks[`${examId}_${cls}_${sub}_${s.roll}`] || 0);
                    marksArr.push({ sub, marks: m });
                    total += m;
                    let g = getGrade(m);
                    totalGP += getGP(g);
                    if(m < 33) fail = true;
                });
                let gpa = fail ? 0 : totalGP / subList.length;
                gpa = Math.round(gpa * 100) / 100;
                let grade = fail ? 'F' : (gpa>=5?'A+':gpa>=4?'A':gpa>=3.5?'A-':gpa>=3?'B':gpa>=2?'C':gpa>=1?'D':'F');
                results.push({ roll: s.roll, name: s.name, marks: marksArr, total, gpa: gpa.toFixed(2), grade, fail });
            });
            results.sort((a,b)=>b.total - a.total);
            results.forEach((r,i)=>r.merit = i+1);
            results.sort((a,b)=>a.roll - b.roll);
            return results;
        }
        
        // ======================= পাবলিক ফলাফল লোড =======================
        function populateExamSelect() {
            let select = document.getElementById('publicExam');
            if(select) select.innerHTML = exams.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        }
        
        window.loadPublicResult = function() {
            let cls = document.getElementById('publicClass').value;
            let examId = parseInt(document.getElementById('publicExam').value);
            let exam = exams.find(e => e.id == examId);
            if(!exam || !exam.open) {
                document.getElementById('publicResultArea').innerHTML = '<div style="text-align:center;padding:50px">⚠️ ফলাফল প্রকাশিত হয়নি</div>';
                return;
            }
            let results = calculateResult(cls, examId);
            let holds = holdList[`${examId}_${cls}`] || {};
            let subList = subjects[cls] || [];
            let html = `<h3 style="text-align:center">📊 ${cls} শ্রেণী - ${exam.name}</h3><div class="results-table"> <table> <thead><tr><th>রোল</th><th>নাম</th>${subList.map(s=>`<th>${s}</th>`).join('')}<th>মোট</th><th>GPA</th><th>গ্রেড</th><th>মেধাক্রম</th><th>ফলাফল</th></tr></thead><tbody>`;
            results.forEach(r => {
                let held = holds[r.roll];
                let holdMsg = '';
                if(held) {
                    if(held.reason === 'due') holdMsg = '(বেতন বাকি)';
                    else if(held.reason === 'dup') holdMsg = '(নাম জটিলতা)';
                    else if(held.reason === 'comp') holdMsg = '(অভিযোগ)';
                    else holdMsg = '(প্রশাসনিক)';
                }
                html += `<tr class="${held ? 'hold-row' : ''}"><td>${bn(r.roll)}</td><td>${r.name}</td>`;
                r.marks.forEach(m => html += `<td class="${m.marks<33?'fail-mark':''}">${bn(m.marks)}</td>`);
                html += `<td>${bn(r.total)}</td><td>${r.gpa}</td><td>${r.grade}</td><td>${bn(r.merit)}</td>`;
                html += `<td>${held ? `<span class="hold-badge">⚠️ স্থগিত ${holdMsg}</span>` : (r.fail ? 'ফেল' : 'পাস ✅')}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            let roll = document.getElementById('publicRoll').value;
            if(roll) {
                html += `<script>setTimeout(()=>{document.querySelectorAll('tbody tr').forEach(row=>{if(row.cells[0].innerText=='${bn(roll)}')row.style.background='#d4edda';});},100);<\/script>`;
            }
            document.getElementById('publicResultArea').innerHTML = html;
        };
        
        // ======================= লগইন ফাংশন =======================
        window.showAdminLogin = function() { document.getElementById('adminLoginModal').style.display = 'flex'; };
        window.showTeacherLogin = function() { document.getElementById('teacherLoginModal').style.display = 'flex'; };
        window.closeModals = function() { document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); };
        
        window.adminLogin = function() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if(u === 'admin' && p === '09876Tuhin54321') {
                currentUser = { role: 'admin', name: 'সুপার অ্যাডমিন' };
                closeModals();
                showAdminPanel();
            } else alert('ভুল তথ্য!');
        };
        
        window.teacherLogin = function() {
            let u = document.getElementById('teacherUser').value;
            let p = document.getElementById('teacherPass').value;
            let t = teachers.find(t => t.username === u && t.password === p);
            if(t) { currentUser = t; closeModals(); showTeacherPanel(); }
            else alert('ভুল তথ্য!');
        };
        
        // ======================= অ্যাডমিন প্যানেল =======================
        function showAdminPanel() {
            document.getElementById('publicPage').style.display = 'none';
            let html = `<div id="adminPanel" class="admin-panel">
                <div class="panel-header"><div><h1>📚 অ্যাডমিন প্যানেল</h1><p>স্বাগতম, ${currentUser.name}</p></div><button onclick="logout()" class="danger">🚪 লগআউট</button></div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="showAdminTab('students')">👥 শিক্ষার্থী</button>
                    <button class="tab-btn" onclick="showAdminTab('exams')">📝 পরীক্ষা</button>
                    <button class="tab-btn" onclick="showAdminTab('marks')">📊 মার্কস</button>
                    <button class="tab-btn" onclick="showAdminTab('results')">📈 ফলাফল</button>
                    <button class="tab-btn" onclick="showAdminTab('teachers')">👨‍🏫 শিক্ষক</button>
                    <button class="tab-btn" onclick="showAdminTab('hold')">🔒 স্থগিত</button>
                </div>
                <div id="tab-students" class="tab-content active"><div id="studentsDiv"></div></div>
                <div id="tab-exams" class="tab-content"><div id="examsDiv"></div></div>
                <div id="tab-marks" class="tab-content"><div id="marksDiv"></div><button onclick="calcAndShow()">📊 ফলাফল গণনা</button></div>
                <div id="tab-results" class="tab-content"><div id="resultsDiv"></div></div>
                <div id="tab-teachers" class="tab-content"><div id="teachersDiv"></div></div>
                <div id="tab-hold" class="tab-content"><div id="holdDiv"></div></div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            renderStudents();
            renderExams();
            renderTeachers();
            renderHold();
        }
        
        function renderStudents() {
            let html = `<div class="form-card"><div class="form-row"><div><select id="stuClass"><option>শিশু</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option></select></div><div><input type="number" id="stuRoll" placeholder="রোল"></div><div><input type="text" id="stuName" placeholder="নাম"></div><div><button onclick="addStudent()">যোগ/আপডেট</button></div></div></div>`;
            for(let cls in allStudents) {
                html += `<h4>${cls} শ্রেণী</h4><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;">`;
                allStudents[cls].forEach(s => {
                    html += `<div style="background:#e8f4fc;padding:5px 15px;border-radius:20px;">রোল ${bn(s.roll)} - ${s.name} <button onclick="delStudent('${cls}',${s.roll})" style="padding:2px 8px;background:#e74c3c;">✖</button></div>`;
                });
                html += `</div>`;
            }
            document.getElementById('studentsDiv').innerHTML = html;
        }
        
        window.addStudent = function() {
            let cls = document.getElementById('stuClass').value;
            let roll = parseInt(document.getElementById('stuRoll').value);
            let name = document.getElementById('stuName').value.trim();
            if(!roll || !name) { alert('রোল ও নাম দিন'); return; }
            let exist = allStudents[cls].find(s => s.roll === roll);
            if(exist) exist.name = name;
            else allStudents[cls].push({ roll, name });
            allStudents[cls].sort((a,b)=>a.roll-b.roll);
            localStorage.setItem('allStudents', JSON.stringify(allStudents));
            renderStudents();
            document.getElementById('stuRoll').value = '';
            document.getElementById('stuName').value = '';
        };
        
        window.delStudent = function(cls, roll) {
            if(confirm('মুছবেন?')) {
                allStudents[cls] = allStudents[cls].filter(s => s.roll !== roll);
                localStorage.setItem('allStudents', JSON.stringify(allStudents));
                renderStudents();
            }
        };
        
        function renderExams() {
            let html = `<div class="form-card"><div class="form-row"><div><input type="text" id="examName" placeholder="পরীক্ষার নাম"></div><div><button onclick="addExam()">✅ তৈরি করুন</button></div></div></div>`;
            exams.forEach(e => {
                html += `<div class="exam-item"><div><strong>${e.name}</strong><br>স্ট্যাটাস: ${e.open ? '✅ ওপেন' : '🔒 ক্লোজড'}</div><div><button class="info" onclick="toggleExam(${e.id})">${e.open ? 'বন্ধ করুন' : 'খুলুন'}</button><button class="danger" onclick="delExam(${e.id})">🗑️</button></div></div>`;
            });
            document.getElementById('examsDiv').innerHTML = html;
        }
        
        window.addExam = function() {
            let name = document.getElementById('examName').value.trim();
            if(!name) { alert('নাম দিন'); return; }
            exams.push({ id: Date.now(), name, open: false });
            localStorage.setItem('exams', JSON.stringify(exams));
            renderExams();
            document.getElementById('examName').value = '';
            populateExamSelect();
        };
        
        window.toggleExam = function(id) {
            let e = exams.find(e => e.id == id);
            if(e) e.open = !e.open;
            localStorage.setItem('exams', JSON.stringify(exams));
            renderExams();
            populateExamSelect();
        };
        
        window.delExam = function(id) {
            if(confirm('পরীক্ষা মুছবেন? সব মার্কসও মুছে যাবে')) {
                exams = exams.filter(e => e.id != id);
                localStorage.setItem('exams', JSON.stringify(exams));
                renderExams();
                populateExamSelect();
            }
        };
        
        function renderMarks() {
            if(exams.length === 0) { document.getElementById('marksDiv').innerHTML = '<div>প্রথমে পরীক্ষা তৈরি করুন</div>'; return; }
            let html = `<div class="form-row"><select id="markExam" onchange="renderMarkInput()">${exams.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select><select id="markClass" onchange="renderMarkInput()"><option>শিশু</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option></select></div><div id="markInputs"></div>`;
            document.getElementById('marksDiv').innerHTML = html;
            renderMarkInput();
        }
        
        window.renderMarkInput = function() {
            let examId = document.getElementById('markExam')?.value;
            let cls = document.getElementById('markClass')?.value;
            if(!examId || !cls) return;
            let subList = subjects[cls] || [];
            let studentsList = allStudents[cls] || [];
            if(studentsList.length === 0) { document.getElementById('markInputs').innerHTML = '<div>শিক্ষার্থী যোগ করুন</div>'; return; }
            let html = '';
            subList.forEach(sub => {
                html += `<div class="subject-group"><h4>📖 ${sub}</h4><div class="marks-grid">`;
                studentsList.forEach(s => {
                    let val = marks[`${examId}_${cls}_${sub}_${s.roll}`] || '';
                    html += `<div class="marks-item">${s.name} (রোল ${bn(s.roll)}): <input type="number" min="0" max="100" id="m_${examId}_${cls}_${sub}_${s.roll}" value="${val}" onchange="saveMark('${examId}_${cls}_${sub}_${s.roll}',this.value)"></div>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('markInputs').innerHTML = html;
        };
        
        window.saveMark = function(key, val) { marks[key] = val; localStorage.setItem('marks', JSON.stringify(marks)); };
        
        window.calcAndShow = function() {
            let examId = document.getElementById('markExam')?.value;
            let cls = document.getElementById('markClass')?.value;
            if(!examId || !cls) return;
            let results = calculateResult(cls, examId);
            let exam = exams.find(e => e.id == examId);
            let subList = subjects[cls] || [];
            let holds = holdList[`${examId}_${cls}`] || {};
            let html = `<h3>📊 ${cls} শ্রেণী - ${exam?.name}</h3><div class="results-table"><table><thead><tr><th>রোল</th><th>নাম</th>${subList.map(s=>`<th>${s}</th>`).join('')}<th>মোট</th><th>GPA</th><th>গ্রেড</th><th>মেধাক্রম</th><th>ফলাফল</th></tr></thead><tbody>`;
            results.forEach(r => {
                let held = holds[r.roll];
                html += `<tr class="${held ? 'hold-row' : ''}"><td>${bn(r.roll)}</td><td>${r.name}</td>`;
                r.marks.forEach(m => html += `<td class="${m.marks<33?'fail-mark':''}">${bn(m.marks)}</td>`);
                html += `<td>${bn(r.total)}</td><td>${r.gpa}</td><td>${r.grade}</td><td>${bn(r.merit)}</td>`;
                html += `<td>${held ? '⚠️ স্থগিত' : (r.fail ? 'ফেল' : 'পাস ✅')}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('resultsDiv').innerHTML = html;
            showAdminTab('results');
        };
        
        function renderTeachers() {
            let html = `<div class="form-card"><div class="form-row"><div><input type="text" id="tName" placeholder="নাম"></div><div><input type="text" id="tUser" placeholder="ইউজারনেম"></div><div><input type="password" id="tPass" placeholder="পাস"></div></div><div id="classAssign"></div><button onclick="addTeacher()">✅ শিক্ষক তৈরি করুন</button></div><h3>শিক্ষক তালিকা</h3>`;
            teachers.forEach(t => {
                let info = t.assigned?.map(a => `${a.class} (${a.subs.join(',')})`).join('; ') || '-';
                html += `<div class="teacher-item"><div><strong>${t.name}</strong> (${t.username})<br><small>${info}</small></div><div><button class="danger" onclick="delTeacher(${t.id})">🗑️</button></div></div>`;
            });
            document.getElementById('teachersDiv').innerHTML = html;
            renderAssignSection();
        }
        
        function renderAssignSection() {
            let classOptions = Object.keys(subjects).map(c => `<option value="${c}">${c}</option>`).join('');
            let subjectOptions = (cls) => (subjects[cls] || []).map(s => `<label style="margin-right:10px"><input type="checkbox" class="subCheck" value="${s}"> ${s}</label>`).join('');
            let html = `<h4>ক্লাস ও বিষয় অ্যাসাইন</h4><div id="assignRows"><div class="form-row"><select class="assignClass" onchange="updateSubOptions(this)">${classOptions}</select><div class="subOptions">${subjectOptions('শিশু')}</div><button type="button" onclick="addAssignRow()">➕ আরও</button></div></div>`;
            document.getElementById('classAssign').innerHTML = html;
        }
        
        window.addAssignRow = function() {
            let classOptions = Object.keys(subjects).map(c => `<option value="${c}">${c}</option>`).join('');
            let div = document.createElement('div');
            div.className = 'form-row';
            div.style.marginTop = '10px';
            div.innerHTML = `<select class="assignClass" onchange="updateSubOptions(this)">${classOptions}</select><div class="subOptions">${(subjects['শিশু']||[]).map(s=>`<label><input type="checkbox" class="subCheck" value="${s}"> ${s}</label>`).join('')}</div><button type="button" onclick="this.parentElement.remove()">🗑️</button>`;
            document.getElementById('assignRows').appendChild(div);
        };
        
        window.updateSubOptions = function(select) {
            let cls = select.value;
            let subs = subjects[cls] || [];
            let div = select.nextElementSibling;
            div.innerHTML = subs.map(s => `<label style="margin-right:10px"><input type="checkbox" class="subCheck" value="${s}"> ${s}</label>`).join('');
        };
        
        window.addTeacher = function() {
            let name = document.getElementById('tName').value.trim();
            let uname = document.getElementById('tUser').value.trim();
            let pwd = document.getElementById('tPass').value;
            if(!name || !uname || !pwd) { alert('সব ঘর পূরণ করুন'); return; }
            if(teachers.find(t=>t.username===uname)) { alert('ইউজারনেম ইতিমধ্যে আছে'); return; }
            let assigned = [];
            document.querySelectorAll('#assignRows .form-row').forEach(row => {
                let cls = row.querySelector('.assignClass').value;
                let subs = [];
                row.querySelectorAll('.subCheck:checked').forEach(cb => subs.push(cb.value));
                if(cls && subs.length) assigned.push({ class: cls, subs });
            });
            if(assigned.length === 0) { alert('কমপক্ষে একটি ক্লাস ও বিষয় অ্যাসাইন করুন'); return; }
            teachers.push({ id: Date.now(), name, username: uname, password: pwd, assigned });
            localStorage.setItem('teachers', JSON.stringify(teachers));
            renderTeachers();
            document.getElementById('tName').value = '';
            document.getElementById('tUser').value = '';
            document.getElementById('tPass').value = '';
        };
        
        window.delTeacher = function(id) {
            if(confirm('শিক্ষক মুছবেন?')) {
                teachers = teachers.filter(t => t.id !== id);
                localStorage.setItem('teachers', JSON.stringify(teachers));
                renderTeachers();
            }
        };
        
        function renderHold() {
            if(exams.length === 0) { document.getElementById('holdDiv').innerHTML = '<div>প্রথমে পরীক্ষা তৈরি করুন</div>'; return; }
            let html = `<div class="form-card"><div class="form-row"><select id="holdExam">${exams.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select><select id="holdClass"><option>শিশু</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option></select><input type="number" id="holdRoll" placeholder="রোল"><button onclick="showHoldReason()">🔒 স্থগিত করুন</button></div></div><h3>স্থগিত তালিকা</h3><div id="holdList"></div>`;
            document.getElementById('holdDiv').innerHTML = html;
            renderHoldList();
        }
        
        window.showHoldReason = function() {
            let examId = document.getElementById('holdExam').value;
            let cls = document.getElementById('holdClass').value;
            let roll = parseInt(document.getElementById('holdRoll').value);
            let student = allStudents[cls]?.find(s => s.roll === roll);
            if(!student) { alert('শিক্ষার্থী নেই'); return; }
            let modal = document.createElement('div');
            modal.id = 'reasonModal';
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content"><h3>স্থগিতের কারণ</h3><p>${student.name} (রোল ${roll})</p><select id="reasonType"><option value="due">বেতন বাকি</option><option value="dup">নাম ২ বার আছে</option><option value="comp">রেজাল্টের অভিযোগ আছে</option><option value="other">অন্যান্য</option></select><div id="reasonDetail"></div><div class="action-buttons"><button onclick="confirmHold('${examId}','${cls}',${roll})">✅ নিশ্চিত</button><button onclick="closeReasonModal()">বাতিল</button></div></div>`;
            document.body.appendChild(modal);
            document.getElementById('reasonType').onchange = function() {
                let d = document.getElementById('reasonDetail');
                if(this.value === 'due') d.innerHTML = '<input type="number" id="dueAmt" placeholder="পরিমাণ টাকা">';
                else if(this.value === 'comp') d.innerHTML = '<input type="text" id="compText" placeholder="অভিযোগের বিবরণ">';
                else if(this.value === 'other') d.innerHTML = '<input type="text" id="otherText" placeholder="কারণ লিখুন">';
                else d.innerHTML = '';
            };
            document.getElementById('reasonType').onchange();
        };
        
        window.confirmHold = function(examId, cls, roll) {
            let reason = document.getElementById('reasonType').value;
            let data = {};
            if(reason === 'due') data = { amount: document.getElementById('dueAmt')?.value || '' };
            else if(reason === 'comp') data = { text: document.getElementById('compText')?.value || '' };
            else if(reason === 'other') data = { text: document.getElementById('otherText')?.value || '' };
            let key = `${examId}_${cls}`;
            if(!holdList[key]) holdList[key] = {};
            holdList[key][roll] = { reason, data, by: 'admin', at: new Date().toISOString() };
            localStorage.setItem('holdList', JSON.stringify(holdList));
            closeReasonModal();
            renderHoldList();
        };
        
        window.closeReasonModal = function() { document.getElementById('reasonModal')?.remove(); };
        
        function renderHoldList() {
            let html = '<div class="results-table"><table><thead><tr><th>পরীক্ষা</th><th>শ্রেণি</th><th>রোল</th><th>নাম</th><th>কারণ</th><th>একশন</th></tr></thead><tbody>';
            for(let key in holdList) {
                let [examId, cls] = key.split('_');
                let exam = exams.find(e => e.id == examId);
                for(let roll in holdList[key]) {
                    let student = allStudents[cls]?.find(s => s.roll == roll);
                    let reasonText = holdList[key][roll].reason === 'due' ? 'বেতন বাকি' : holdList[key][roll].reason === 'dup' ? 'নাম ২ বার' : holdList[key][roll].reason === 'comp' ? 'অভিযোগ' : 'অন্যান্য';
                    html += `<tr><td>${exam?.name || ''}</td><td>${cls}</td><td>${bn(roll)}</td><td>${student?.name || ''}</td><td>${reasonText}</td><td><button class="warning" onclick="unhold('${key}',${roll})">🔓 আন-হোল্ড</button></td></tr>`;
                }
            }
            html += `</tbody></table></div>`;
            if(Object.keys(holdList).length === 0) html = '<div>কোনো স্থগিত রেজাল্ট নেই</div>';
            document.getElementById('holdList').innerHTML = html;
        }
        
        window.unhold = function(key, roll) {
            if(confirm('স্থগিত বাতিল করবেন?')) {
                delete holdList[key][roll];
                if(Object.keys(holdList[key]).length === 0) delete holdList[key];
                localStorage.setItem('holdList', JSON.stringify(holdList));
                renderHoldList();
            }
        };
        
        window.showAdminTab = function(tab) {
            document.querySelectorAll('#adminPanel .tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            if(tab === 'marks') renderMarks();
            if(tab === 'exams') renderExams();
            if(tab === 'students') renderStudents();
            if(tab === 'teachers') renderTeachers();
            if(tab === 'hold') renderHold();
        };
        
        // ======================= শিক্ষক প্যানেল =======================
        function showTeacherPanel() {
            document.getElementById('publicPage').style.display = 'none';
            let assigned = currentUser.assigned || [];
            if(assigned.length === 0) {
                document.body.innerHTML = `<div style="text-align:center;padding:50px"><h3>⚠️ আপনাকে কোনো ক্লাস অ্যাসাইন করা হয়নি</h3><button onclick="logout()">লগআউট</button></div>`;
                return;
            }
            let html = `<div id="teacherPanel" class="teacher-panel"><div class="panel-header"><div><h1>📚 শিক্ষক প্যানেল</h1><p>স্বাগতম, ${currentUser.name}</p></div><button onclick="logout()" class="danger">🚪 লগআউট</button></div>
                <div class="tabs"><button class="tab-btn active" onclick="showTeacherTab('marks')">📊 মার্কস ইনপুট</button><button class="tab-btn" onclick="showTeacherTab('results')">📈 ফলাফল দেখুন</button></div>
                <div id="teacherMarksTab" class="tab-content active"><div id="teacherMarksDiv"></div><button onclick="calcTeacherResult()">📊 ফলাফল গণনা</button></div>
                <div id="teacherResultsTab" class="tab-content"><div id="teacherResultsDiv"></div></div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            renderTeacherMarks();
        }
        
        function renderTeacherMarks() {
            let assigned = currentUser.assigned || [];
            let html = `<div class="form-row"><select id="teacherClass" onchange="renderTeacherMarkInput()">${assigned.map(a=>`<option value="${a.class}">${a.class} শ্রেণী</option>`).join('')}</select></div><div id="teacherMarkInputs"></div>`;
            document.getElementById('teacherMarksDiv').innerHTML = html;
            renderTeacherMarkInput();
        }
        
        window.renderTeacherMarkInput = function() {
            let cls = document.getElementById('teacherClass')?.value;
            if(!cls) return;
            let teacherClass = currentUser.assigned?.find(a => a.class === cls);
            if(!teacherClass) return;
            let subList = teacherClass.subs;
            let studentsList = allStudents[cls] || [];
            let examId = exams.length > 0 ? exams[0].id : null;
            if(!examId) { document.getElementById('teacherMarkInputs').innerHTML = '<div>কোনো পরীক্ষা নেই</div>'; return; }
            let html = '';
            subList.forEach(sub => {
                html += `<div class="subject-group"><h4>📖 ${sub}</h4><div class="marks-grid">`;
                studentsList.forEach(s => {
                    let val = marks[`${examId}_${cls}_${sub}_${s.roll}`] || '';
                    html += `<div class="marks-item">${s.name} (রোল ${bn(s.roll)}): <input type="number" min="0" max="100" id="tm_${examId}_${cls}_${sub}_${s.roll}" value="${val}" onchange="saveTeacherMark('${examId}_${cls}_${sub}_${s.roll}',this.value)"></div>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('teacherMarkInputs').innerHTML = html;
        };
        
        window.saveTeacherMark = function(key, val) { marks[key] = val; localStorage.setItem('marks', JSON.stringify(marks)); };
        
        window.calcTeacherResult = function() {
            let cls = document.getElementById('teacherClass')?.value;
            let examId = exams.length > 0 ? exams[0].id : null;
            if(!cls || !examId) return;
            let results = calculateResult(cls, examId);
            let exam = exams.find(e => e.id == examId);
            let subList = subjects[cls] || [];
            let html = `<h3>📊 ${cls} শ্রেণী - ${exam?.name}</h3><div class="results-table"><table><thead><tr><th>রোল</th><th>নাম</th>${subList.map(s=>`<th>${s}</th>`).join('')}<th>মোট</th><th>GPA</th><th>গ্রেড</th><th>মেধাক্রম</th><th>ফলাফল</th></tr></thead><tbody>`;
            results.forEach(r => {
                html += `<tr><td>${bn(r.roll)}</td><td>${r.name}</td>`;
                r.marks.forEach(m => html += `<td class="${m.marks<33?'fail-mark':''}">${bn(m.marks)}</td>`);
                html += `<td>${bn(r.total)}</td><td>${r.gpa}</td><td>${r.grade}</td><td>${bn(r.merit)}</td>`;
                html += `<td>${r.fail ? 'ফেল' : 'পাস ✅'}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('teacherResultsDiv').innerHTML = html;
            showTeacherTab('results');
        };
        
        window.showTeacherTab = function(tab) {
            document.querySelectorAll('#teacherPanel .tab-content').forEach(t => t.classList.remove('active'));
            if(tab === 'marks') document.getElementById('teacherMarksTab').classList.add('active');
            else document.getElementById('teacherResultsTab').classList.add('active');
        };
        
        window.logout = function() { location.reload(); };
        
        // ======================= প্রাথমিক লোড =======================
        populateExamSelect();
        loadPublicResult();
    })();
</script>
</body>
</html>
